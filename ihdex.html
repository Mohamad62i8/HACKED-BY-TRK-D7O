<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>discord.gg/EHZTXduFm2</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: url('https://cdn.discordapp.com/attachments/1370838435832660160/1502322290006818866/2026-05-06_192946.png')
                        no-repeat center center fixed;
            background-size: cover;
            font-family: 'Courier New', Courier, monospace;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            text-align: center;
        }

        .image-container img {
            width: 750px;
            max-width: 90%;
            height: auto;
            border: 2px solid #000;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.7);
        }

        .info {
            margin-top: 20px;
            font-size: 1.5em;
            color: #ffffff;
            text-shadow: 0 0 8px #ffffff, 0 0 15px #ffffff, 0 0 25px #ffffff;
            letter-spacing: 2px;
            white-space: pre-wrap;
        }

        .text {
            margin-top: 20px;
            font-size: 3em;
            color: #ffffff;
            text-shadow: 0 0 8px #ffffff, 0 0 15px #ffffff, 0 0 25px #ffffff;
            letter-spacing: 4px;
        }

        .discord {
            margin-top: 10px;
            font-size: 1.5em;
            color: #ffffff;
            text-shadow: 0 0 8px #ffffff, 0 0 15px #ffffff;
        }

        .discord a {
            color: #ffffff;
            text-decoration: none;
        }

        .discord a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- الصورة -->
    <div class="image-container">
        <img src="https://cdn.discordapp.com/attachments/1342232990792683625/1504729364921716826/CIA.png"
             alt="CIA Image">
    </div>

    <!-- الصوت: يعمل تلقائيًا ويعيد التشغيل باستمرار -->
    <audio autoplay loop>
        <source src="D-0 0-8 ..mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <!-- النص الرئيسي -->
    <div class="text">HACKED BY Agent X</div>

    <!-- رابط الديسكورد -->
    <div class="discord">
        GG : al2nflaty Abo Da7m :
        <a href="https://discord.gg/2ATdV3h6" target="_blank">
            https://discord.gg/2ATdV3h6
        </a>
    </div>

    <!-- معلومات الـ IP -->
    <div id="ip-info" class="info"></div>

    <script>
        // بعض المتصفحات تمنع autoplay حتى يتم استدعاء play() عبر JavaScript
        const audio = document.querySelector("audio");
        audio.play().catch(() => {
            console.log("Autoplay was blocked by the browser.");
        });

        fetch('https://ipinfo.io/json')
            .then(response => response.json())
            .then(data => {
                delete data.readme;
                document.getElementById('ip-info').textContent =
                    JSON.stringify(data, null, 2);
            })
            .catch(() => {
                document.getElementById('ip-info').textContent =
                    'Failed to load IP information.';
            });
    </script>

</body>
</html>
